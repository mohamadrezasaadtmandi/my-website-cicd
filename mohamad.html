<!DOCTYPE html>
<html>
<body>

<h3 id="show">عدد: 25</h3>
<input type="range" id="slider" min="0" max="100" value="25">

<script>
  let slider = document.querySelector("#slider");
  let show = document.querySelector("#show");

  slider.addEventListener("input", function() {
    show.textContent = "عدد: " + slider.value;
  });
</script>

</body>
</html>
